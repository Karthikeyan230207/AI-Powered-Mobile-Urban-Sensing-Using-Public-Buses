<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urban Intelligence Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/dashboard-style.css">
</head>
<body>
<header>
<div><h1>🏙️ Urban Intelligence</h1><p>Mobile AI sensing network for safer roads</p></div>
<button onclick="seedDemo()">Load Demo Data</button>
</header>
<main>
<section class="cards">
<div class="card"><span>Potholes</span><strong id="potholes">0</strong></div>
<div class="card"><span>Total Incidents</span><strong id="total">0</strong></div>
<div class="card"><span>Critical</span><strong id="critical">0</strong></div>
<div class="card"><span>Repaired</span><strong id="repaired">0</strong></div>
</section>
<section class="grid">
<div class="panel"><h2>🗺️ Incident Map</h2><div id="map"></div></div>
<div class="panel"><h2>🚨 Critical Alerts</h2><div id="alerts"></div></div>
</section>
<section class="panel">
<h2>🔧 Incident Management</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Code</th><th>Bus</th><th>Type</th><th>Confidence</th><th>Priority</th><th>Verified</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="table"></tbody>
</table>
</div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
